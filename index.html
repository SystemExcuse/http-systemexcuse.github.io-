<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SystemExcuse · 科技区UP主</title>
  <style>
    /* 渐变蓝 · 全局样式 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0b2b5e 0%, #1b4f9e 40%, #3a7bd5 80%, #6aa9ff 100%);
      background-attachment: fixed;
      padding: 1.5rem;
    }

    /* 主卡片：磨砂玻璃+渐变边框 */
    .home-card {
      max-width: 680px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 3.5rem;
      padding: 3rem 2.5rem;
      box-shadow: 
        0 30px 50px rgba(0, 10, 30, 0.5),
        0 0 0 1.5px rgba(255, 255, 255, 0.15) inset,
        0 0 0 1px rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 20, 50, 0.6);
    }

    .home-card:hover {
      transform: scale(1.01);
      box-shadow: 
        0 40px 60px rgba(0, 15, 40, 0.6),
        0 0 0 2px rgba(255, 255, 255, 0.25) inset,
        0 0 0 1px rgba(255, 255, 255, 0.4);
    }

    /* 主标题区域 */
    .title-section {
      margin-bottom: 2rem;
    }

    .greeting {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff 0%, #d4eaff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(120, 180, 255, 0.5);
    }

    .name-highlight {
      font-size: 2.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f0f9ff 0%, #b0d4ff 80%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
      text-shadow: 0 0 25px rgba(160, 210, 255, 0.7);
      letter-spacing: 1px;
    }

    /* 信息行：统一卡片风格 */
    .info-block {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin: 2rem 0 2.2rem;
    }

    .info-item {
      background: rgba(20, 50, 110, 0.35);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 3rem;
      padding: 1rem 2rem;
      border: 1px solid rgba(180, 215, 255, 0.5);
      box-shadow: 0 8px 18px rgba(0, 15, 40, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      transition: background 0.3s, border-color 0.2s;
    }

    .info-item:hover {
      background: rgba(30, 70, 140, 0.55);
      border-color: rgba(210, 230, 255, 0.9);
    }

    .info-label {
      font-weight: 500;
      font-size: 1.1rem;
      color: #c9e2ff;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .info-label::before {
      content: "✦";
      font-size: 1rem;
      opacity: 0.9;
      color: #9ac7ff;
    }

    .info-value {
      font-weight: 600;
      font-size: 1.2rem;
      word-break: break-word;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 30, 70, 0.8);
    }

    /* 链接样式 —— 使其明显可跳转 */
    .bili-link {
      color: #ffffff;
      text-decoration: none;
      background: linear-gradient(120deg, #1e88e5, #4dabff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      border-bottom: 2px solid rgba(200, 230, 255, 0.7);
      padding-bottom: 2px;
      transition: all 0.2s ease;
      filter: drop-shadow(0 2px 6px rgba(0, 60, 130, 0.6));
      text-decoration: none;
      /* 让背景裁切文字保持可见 */
      background-clip: text;
      -webkit-text-fill-color: transparent;
      background-image: linear-gradient(135deg, #ffffff, #b3dcff);
    }

    .bili-link:hover {
      border-bottom-color: #ffffff;
      filter: drop-shadow(0 0 12px #b0d4ff);
      transform: scale(1.02);
      background-image: linear-gradient(135deg, #ffffff, #d4ebff);
    }

    /* QQ 行特殊处理——可点击复制或者单纯展示，这里单纯显示但加图标感 */
    .qq-number {
      background: rgba(255, 255, 255, 0.15);
      padding: 0.2rem 0.9rem;
      border-radius: 3rem;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      font-weight: 700;
      font-size: 1.4rem;
      color: #d9eeff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 15px rgba(100, 180, 255, 0.3);
      display: inline-block;
    }

    /* 欢迎语区域 */
    .welcome-section {
      margin-top: 1.5rem;
      padding: 1.5rem 0.5rem 0.5rem;
      border-top: 2px dashed rgba(160, 210, 255, 0.5);
    }

    .welcome-text {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ffffff, #b8dbff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(80, 160, 255, 0.7);
      animation: softPulse 3s infinite alternate;
    }

    @keyframes softPulse {
      0% { text-shadow: 0 0 15px rgba(120, 180, 255, 0.5); }
      100% { text-shadow: 0 0 35px rgba(180, 220, 255, 0.9); }
    }

    /* 装饰小字：创建年份等 */
    .meta-note {
      margin-top: 1.2rem;
      font-size: 0.9rem;
      opacity: 0.75;
      letter-spacing: 1px;
      color: #c3dcff;
    }

    /* 响应式调整 */
    @media (max-width: 500px) {
      .home-card {
        padding: 2rem 1.2rem;
        border-radius: 2.2rem;
      }
      .greeting {
        font-size: 1.6rem;
      }
      .name-highlight {
        font-size: 2rem;
      }
      .info-item {
        padding: 0.9rem 1rem;
        flex-direction: column;
        text-align: center;
      }
      .info-label {
        font-size: 1rem;
      }
      .info-value {
        font-size: 1.1rem;
      }
      .qq-number {
        font-size: 1.2rem;
      }
      .welcome-text {
        font-size: 1.6rem;
        letter-spacing: 2px;
      }
    }

    /* 自定义选中文字颜色 */
    ::selection {
      background: #3f8eff;
      color: #ffffff;
      text-shadow: none;
    }
  </style>
</head>
<body>
  <main class="home-card">
    <!-- 主标题：我是SystemExcuse -->
    <div class="title-section">
      <div class="greeting">
        我是 <span class="name-highlight">SystemExcuse</span>
      </div>
      <div style="font-size: 1.2rem; font-weight: 400; opacity: 0.9; letter-spacing: 0.5px;">
        科技区UP主 · 2022年创建账号
      </div>
    </div>

    <!-- 信息列表 -->
    <div class="info-block">
      <!-- 主页链接：B站短链，点击跳转 -->
      <div class="info-item">
        <span class="info-label">主页</span>
        <span class="info-value">
          <a href="https://b23.tv/oPcdTdy" 
             target="_blank" 
             rel="noopener noreferrer" 
             class="bili-link">
            https://b23.tv/oPcdTdy
          </a>
        </span>
        <span style="font-size: 0.9rem; opacity: 0.8; margin-left: 0.2rem;">(点击跳转)</span>
      </div>

      <!-- QQ 号 -->
      <div class="info-item">
        <span class="info-label">QQ</span>
        <span class="info-value">
          <span class="qq-number">2918538106</span>
        </span>
      </div>
    </div>

    <!-- 欢迎语 -->
    <div class="welcome-section">
      <div class="welcome-text">欢迎</div>
      <div class="meta-note">
        ⚡ 感谢每一份关注 · 科技区见 ⚡
      </div>
    </div>
  </main>
</body>
    </html>
